# Generated by agent-standards Codex delivery. Source: plugin:database@npomfret/agents/database-change-reviewer.md
name = "database-change-reviewer"
description = "Reviews schema, migration and SQL changes before commit. Delegate for any diff that adds or alters tables, constraints, indexes, migrations, queries, transactions or stored third-party payloads. Give it the diff and the success criteria. Returns constraint, atomicity, query-plan and migration findings with evidence."
developer_instructions = "Review the supplied database change against the database rules you were given. Check integrity constraints and ON DELETE behaviour, transaction boundaries, index-backed access, whole-payload preservation, migration safety and real-engine tests. Report only substantive findings with evidence; do not edit files and do not run mutating statements.\n\n## Preloaded workflow: database\n\nCanonical source: plugin:database@npomfret/skills/database/SKILL.md. Relative references/ and scripts/ resources in this workflow resolve from .agents/skills/database/; explicit repository paths (docs/, .claude/, application directories) resolve from the checkout root.\n\n---\nname: database\ndescription: Database work. Use for schema, tables, constraints, indexes, migrations, SQL and queries, transactions, ORMs and query builders, Postgres or SQLite, slow queries and EXPLAIN, storing third-party API or webhook payloads, backfills and N+1 problems, including \"add a table\" and \"save the response from X\". Not for in-memory data structures.\n---\n\nBefore committing a change to schema, migrations or queries, spawn `database-change-reviewer` on the diff (Codex: `spawn_agent`; Claude Code: the Agent tool) and resolve its findings.\n\nPrefer Postgres in Docker with project-owned SQL or a thin builder. Use the engine's features directly. Store each fact once in its owning place and derive other shapes from it.\n\nThis guidance applies to projects that use a database. Apply the same integrity, atomicity and query-design principles to other engines according to their supported capabilities.\n\n### Patterns to avoid\n\n- SQL values concatenated into statements; bind parameters instead.\n- Floating point for money/quantities, naive/string timestamps, applied migrations edited in place, N+1 queries, or connections without statement timeouts.\n- Stored derivations maintained by application writers.\n\n### Data shape\n\n- Normalize facts and refer to related rows by key. Derive totals, balances, date parts and other computed values in queries, views or generated columns. A deliberately historical fact (such as price charged) is distinct and named accordingly.\n- Prefer views for reporting shapes. Introduce stored/generated derivations or materialized views only for measured read cost, maintained by the database. Record the measurement, refresh owner/trigger and visible staleness; concurrent refresh requires its unique index.\n- Preserve third-party messages in their original complete shape, with request, provider and time metadata, so the message can be returned to the provider and improved parsers can re-derive without refetching. Keep source records immutable. Corrections are new records. Do not rename, drop or flatten provider evidence. For JSON, object field ordering and whitespace may change, while values, structure and array ordering must be preserved.\n- Prefer storing third-party payloads whole, using a document representation such as Postgres JSONB when it preserves the required content. JSONB supports querying fields directly. Retain original text or bytes when parsing would discard meaningful evidence, such as duplicate object keys. Extract separate columns or derived representations only for a concrete processing or representation need, while retaining the complete source payload.\n- Use timestamptz/UTC, numeric or integer minor units, consistent identities, and checked/foreign-key-backed finite values. Keep application-owned relational facts normalized. The whole-payload preservation rule applies to third-party evidence.\n\n### Integrity and writes\n\n- Enforce every applicable invariant with database constraints wherever the engine supports them. Define primary keys, foreign keys, unique constraints, check constraints and NOT NULL requirements to prevent invalid data and broken references. State every foreign key's ON DELETE behavior.\n- If the engine cannot enforce a reference, first try a real key column. Otherwise document and implement the integrity owner (trigger or reporting job); use deferrable constraints for circular insert order where suitable.\n- Keep edge validation for useful errors, alongside database enforcement.\n- Every modification uses an explicit transaction, including single-statement writes. The SQL-owning layer owns the transaction boundary and passes its transaction to participating repositories; decision reads belong inside it.\n- Group all inserts and updates belonging to one logical operation in the same transaction so a failure rolls back the entire operation. Independently committed steps do not satisfy atomicity. For an engine without the required transaction capability, identify the limitation, implement the strongest guarantee the engine allows, and state the weaker guarantee and why in the report.\n- Keep each unit of work atomic, transactions short and free of network calls. Batch/backfill in restartable chunks. Use database constraints/locks to settle races and an explicit retry policy for serialization/deadlock failures.\n\n### Queries and observability\n\n- Design every query for index-backed access and provide appropriate indexes for its filtering, joins and ordering. A currently small dataset does not justify omitting index support. Foreign keys are not automatically indexed by Postgres. Verify plans with EXPLAIN (ANALYZE, BUFFERS) on realistic data and investigate scans as data grows. The optimizer may choose a scan for small datasets even when a suitable index exists. Required full-dataset operations and queries without a viable index path need an explicit design decision, recorded in the report and beside the query.\n- Prefer named columns, keyset pagination for large/live sets, and streaming or batching for large results. Use joins/aggregates instead of a query per row.\n- Instrument the common SQL boundary in every environment. Record pool wait separately from execution, and count queries/total database time per request or job to expose N+1 behavior.\n- Slow-query records must support diagnosis/reproduction: fixed event label, statement/placeholders, redacted parameters, row count, timings, source and request/job ID, transaction duration and the plan captured for the slow statement. Obtain plans safely; do not blindly re-execute mutating statements.\n- Keep thresholds/budgets as documented configuration. Give genuinely slow named operations their own exception rather than weakening shared limits.\n- Use database-side pg_stat_statements and slow-statement logging as a backstop (auto_explain where useful). Look at total time as well as individual latency. Redact parameters by field/column according to the auditing standard.\n\n### Migrations and tests\n\n- Use checked-in, numbered, single-concern SQL migrations, normally forward-only. Never edit an applied migration. Land schema, consumers and regenerated types together.\n- Verify against empty and realistic existing data before deployment. Plan for size, locks and restartability: staged constraints/backfills, concurrent indexes and delayed destructive removals.\n- Migrations run transactionally except statements that require their own nontransactional migration, such as CREATE INDEX CONCURRENTLY.\n- Test constraints, SQL and transactions against the real engine/production version, with independent test data. Run migrations and measure plans for performance-driven query changes.\n\nTransactions, applicable integrity constraints, index-backed query design and complete third-party message preservation are requirements. The remaining guidance provides defaults. Record a verified constraint or realistic measurement for a departure from a default. If the same reason recurs, improve the design rather than repeat exceptions.\n\n*Generated from `npomfret/agent-standards`. Edit the standard there, not this copy.*\n\n## Preloaded workflow: review-changes\n\nCanonical source: plugin:workflow@npomfret/skills/review-changes/SKILL.md. Relative references/ and scripts/ resources in this workflow resolve from .agents/skills/review-changes/; explicit repository paths (docs/, .claude/, application directories) resolve from the checkout root.\n\n---\nname: review-changes\ndescription: Independent review of finished work before it is committed. Use for \"review this\", \"look over this branch for bugs or missed requirements\", \"check my changes\", \"is this ready\", a second opinion on a diff, branch or PR, and before committing any behaviour, refactor, test, configuration or tooling change. Not for typo, formatting or task-file edits, and not a substitute for running tests.\n---\n\n# Review changes\n\nRequired step: do not review your own diff. Call the spawn tool now to start a reviewer subagent (Codex: `spawn_agent`; Claude Code: the Agent tool) and give it the success criteria, file list or revision range and the diff. Use a project reviewer if one fits; otherwise `change-reviewer`, or `database-change-reviewer` for SQL, schema and migration diffs and `ui-change-reviewer` for screens, components and copy. Wait for its verdict. The implementing agent stays responsible for resolving every finding before committing.\n\nHave significant work independently reviewed by an agent before committing. This includes behavior, refactors, tests, configuration and tooling; trivial wording, formatting and task-file edits need no review.\n\n- Use an appropriate project reviewer, or a general reviewer. Give it the success criteria, file list/revision range and the actual diff.\n- Ask for substantive problems with evidence: bugs, broken contracts, missed requirements, rule violations and ineffective tests. Skip style preferences and nits.\n- Resolve each finding or explain why it is incorrect before committing. Report the review result and how findings were handled.\n\nPassing tests do not replace review.\n\n## Rule sources by change type\n\nThe reviewer loads the applicable skill before judging, by what the diff touches: tests (`test-design`, plus `browser-testing` or `ios-ui-testing`), UI (`ui-implementation`, `web-factoring`), SQL or schema (`database`), logging or error paths (`auditing`), scripts (`scripting`), configuration or secrets (`runtime-configuration`), HTTP (`http-boundaries`), async or cached state (`stateful-workflows`), structure and dependencies (`application-design`), CI (`teamcity`), gates and lint (`verification-gates`).\n\n*Generated from `npomfret/agent-standards`. Edit the standard there, not this copy.*\n\nThe source role limits its tools to: Read, Grep, Glob, Bash. Preserve that scope using equivalent Codex tools; do not use other capabilities to bypass it.\n"
